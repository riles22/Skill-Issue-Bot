name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Actions are pinned to commit SHAs (Dependabot keeps them fresh); jobs get
# the least privilege they need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        # Same pinned set the Docker image installs, so tests cover what ships
        run: pip install -r requirements.txt -c constraints.txt
      - name: Run tests
        run: python -m unittest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build image
        run: docker build -t skill-issue-bot .

  # Publishes to GHCR only on main/tag pushes, and only after every job above
  # has passed — a broken push must never replace :latest.
  #
  # The image is built and pushed exactly once, under an untagged-looking
  # "candidate" name; Trivy then scans the *pushed* amd64 and arm64 digests,
  # and only if both pass are the real tags (:latest, :<sha>, semver) pointed
  # at that same digest. Promotion is a manifest-only copy, so the bytes that
  # were scanned are bit-for-bit the bytes that ship — a rebuild between scan
  # and push could otherwise resolve different Debian packages.
  publish:
    if: github.event_name == 'push'
    needs: [test, lint, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/skill-issue-bot
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # arm64 included so the image runs on free ARM hosts (Oracle Ampere,
      # Raspberry Pi) as well as ordinary x86 servers
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # :latest tracks main; release tags (git tag v1.2.3) get semver
          # image tags; every publish also gets the full commit SHA.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The candidate tag stays behind as the immutable scan record; it
          # points at the same digest as the promoted tags, so it costs no
          # extra storage and is never what users pull.
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # SPDX SBOM and build provenance published as image attestations
          sbom: true
          provenance: mode=max
      - name: Resolve per-platform digests of the pushed image
        id: digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          raw=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          for arch in amd64 arm64; do
            digest=$(jq -re --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
              <<<"$raw")
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Scan pushed image for known vulnerabilities (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digests.outputs.amd64 }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan pushed image for known vulnerabilities (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digests.outputs.arm64 }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Promote scanned digest to final tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
